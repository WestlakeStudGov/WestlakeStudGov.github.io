name: Import school calendar events

on:
  schedule:
    - cron: "15 11 * * *"   # every day around 4-5 AM Utah time
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: totals
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Westlake High calendar
        run: python3 scripts/import_school_events.py
      - name: Save the new list
        run: |
          git add data/school-events.json
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git config user.name "wsg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update school events"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
